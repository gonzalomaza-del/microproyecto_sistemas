<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Flutter reemplaza este valor con --base-href al compilar. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rompecabezas deslizante 15-Puzzle hecho con Flutter.">
  <meta name="theme-color" content="#6750A4">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="15-Puzzle">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>15-Puzzle Flutter</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Registra el service worker propio para que el juego funcione sin conexión.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (error) {
          console.warn('No se pudo registrar el service worker:', error);
        });
      });
    }
  </script>
</body>
</html>
